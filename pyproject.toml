[project]
name = "vpn"
version = "0.1.0"
description = "VPN Orchestrator — event-driven sing-box manager with tun2socks bridging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
vpn-internal = "vpn.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--tb=short",
    "--cov=src", "--cov-report=term-missing", "--cov-fail-under=80"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: marks fast unit tests",
    "integration: marks tests requiring network or root",
]
